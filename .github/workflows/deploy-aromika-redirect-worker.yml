name: Deploy Aromika Redirect Worker

on:
  push:
    branches: [main]
    paths:
      - 'seo/aromika-redirect-worker-v1.js'
      - 'wrangler.redirects.toml'
      - '.github/workflows/deploy-aromika-redirect-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.redirects.toml
