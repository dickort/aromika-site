name: Update promotions feed V3
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-promos.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect live promotions
        run: python collector/collect_promos.py
      - name: Show collection result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/promos-v3.json',encoding='utf-8'))
          print('sources=', json.dumps(d.get('sources',{}), ensure_ascii=False, indent=2))
          print('products=', len(d.get('products',[])))
          for p in d.get('products',[])[:20]:
              print(p.get('source'), p.get('discount'), p.get('price'), p.get('name'))
          PY
      - name: Commit feed when changed
        run: |
          git config user.name "aromika-promos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/promos-v3.json
          git diff --cached --quiet && exit 0
          git commit -m "Update promotions feed V3"
          git push
